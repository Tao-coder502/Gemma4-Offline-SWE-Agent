name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-verify:
    name: Test & Verify (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Core & Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Syntax and AST Sanity Check
        run: |
          python -c "import ast, glob, sys; files = glob.glob('**/*.py', recursive=True); [ast.parse(open(f, encoding='utf-8', errors='replace').read(), filename=f) for f in files]; print(f'Successfully validated {len(files)} Python files.')"

      - name: Run Submission Verifier (81/81 Clean-Room Checks)
        run: |
          python tools/verify_clean_submission.py

      - name: Run Full Pytest Test Suite
        run: |
          pytest tests/ -v

      - name: Run Live SWE Agent Demonstration (Sub-5s Repair)
        run: |
          python demo.py
